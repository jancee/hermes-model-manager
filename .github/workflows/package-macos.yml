name: Package macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare build environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check source and native behavior
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/check-localization.py
          .venv/bin/python scripts/check-project.py
          bash scripts/check-ui.sh
      - name: Build and verify a relocatable macOS package
        run: .venv/bin/python scripts/package-macos.py --arch '${{ matrix.arch }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macOS-${{ matrix.arch }}
          path: dist/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
